<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo - B.O. Assistência</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --line: #dbe4f0;
      --text: #152033;
      --muted: #66758f;
      --primary: #1d4ed8;
      --primary-2: #60a5fa;
      --soft: #eef4ff;
      --ok: #166534;
      --warn: #b45309;
      --danger: #991b1b;
      --radius: 18px;
      --shadow: 0 10px 24px rgba(21, 32, 51, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      width: min(1220px, calc(100% - 18px));
      margin: 18px auto 28px;
    }

    .hero, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 18px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #eff6ff, #ffffff);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 32px);
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .stat small {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 28px;
    }

    .card {
      padding: 16px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 220px 220px 180px;
      gap: 10px;
      margin-bottom: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29,78,216,0.12);
    }

    .list {
      display: grid;
      gap: 14px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }

    .item-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 0;
    }

    .thumb {
      min-height: 220px;
      background: #f8fafc;
      border-right: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 16px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .topline h3 {
      margin: 0;
      font-size: 20px;
    }

    .badge {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: #fff;
      white-space: nowrap;
    }

    .novo { color: var(--warn); }
    .analise { color: var(--primary); }
    .concluido { color: var(--ok); }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .meta-box {
      background: #f8fbff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
    }

    .meta-box b {
      display: block;
      margin-bottom: 4px;
    }

    .desc {
      background: #f8fbff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.55;
      font-size: 14px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .admin-note {
      min-height: 84px;
      resize: vertical;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; }
    .btn-soft { background: #f3f4f6; color: var(--text); border: 1px solid var(--line); }
    .btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

    .empty {
      text-align: center;
      padding: 30px 16px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fff;
    }

    @media (max-width: 980px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .item-grid { grid-template-columns: 1fr; }
      .thumb { min-height: 220px; border-right: none; border-bottom: 1px solid var(--line); }
      .meta, .actions, .admin-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .wrap { width: min(100% - 12px, 1220px); }
      .stats, .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Painel administrativo de B.O.</h1>
      <p>Visualização dos chamados abertos por cliente ou representante, com atualização de status e observação interna.</p>
    </section>

    <section class="stats">
      <div class="stat"><small>Total</small><strong id="statTotal">0</strong></div>
      <div class="stat"><small>Novos</small><strong id="statNovo">0</strong></div>
      <div class="stat"><small>Em análise</small><strong id="statAnalise">0</strong></div>
      <div class="stat"><small>Concluídos</small><strong id="statConcluido">0</strong></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <input type="text" id="busca" placeholder="Buscar cliente, produto, serial, pedido ou descrição" />
        <select id="filtroStatus">
          <option value="Todos">Todos os status</option>
          <option value="Novo">Novo</option>
          <option value="Em análise">Em análise</option>
          <option value="Concluído">Concluído</option>
        </select>
        <select id="filtroProduto">
          <option value="Todos">Todos os tipos</option>
          <option value="gabinete">Gabinete</option>
          <option value="fonte">Fonte</option>
          <option value="cooler">Cooler</option>
          <option value="placa">Placa</option>
        </select>
        <button class="btn-soft" id="btnAtualizar">Atualizar</button>
      </div>

      <div id="lista" class="list"></div>
    </section>
  </div>

  <script>
    const DB_NAME = 'assistenciaBO';
    const STORE_NAME = 'chamados';
    let db = null;
    let records = [];

    const busca = document.getElementById('busca');
    const filtroStatus = document.getElementById('filtroStatus');
    const filtroProduto = document.getElementById('filtroProduto');
    const btnAtualizar = document.getElementById('btnAtualizar');
    const lista = document.getElementById('lista');

    const statTotal = document.getElementById('statTotal');
    const statNovo = document.getElementById('statNovo');
    const statAnalise = document.getElementById('statAnalise');
    const statConcluido = document.getElementById('statConcluido');

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function statusClass(status) {
      if (status === 'Concluído') return 'concluido';
      if (status === 'Em análise') return 'analise';
      return 'novo';
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onerror = () => reject(request.error || new Error('Erro ao abrir banco'));
      });
    }

    function getStore(mode = 'readonly') {
      return db.transaction(STORE_NAME, mode).objectStore(STORE_NAME);
    }

    function loadData() {
      return new Promise((resolve, reject) => {
        const request = getStore('readonly').getAll();
        request.onsuccess = () => {
          records = (request.result || []).sort((a, b) => b.id - a.id);
          resolve(records);
        };
        request.onerror = () => reject(request.error || new Error('Erro ao carregar dados'));
      });
    }

    function updateRecord(record) {
      return new Promise((resolve, reject) => {
        const request = getStore('readwrite').put(record);
        request.onsuccess = () => resolve(true);
        request.onerror = () => reject(request.error || new Error('Erro ao atualizar registro'));
      });
    }

    function deleteRecord(id) {
      return new Promise((resolve, reject) => {
        const request = getStore('readwrite').delete(id);
        request.onsuccess = () => resolve(true);
        request.onerror = () => reject(request.error || new Error('Erro ao excluir registro'));
      });
    }

    function renderStats(data) {
      statTotal.textContent = data.length;
      statNovo.textContent = data.filter(x => x.status === 'Novo').length;
      statAnalise.textContent = data.filter(x => x.status === 'Em análise').length;
      statConcluido.textContent = data.filter(x => x.status === 'Concluído').length;
    }

    function getFiltered() {
      const term = busca.value.trim().toLowerCase();
      const status = filtroStatus.value;
      const produto = filtroProduto.value.toLowerCase();

      let filtered = records.filter(r => {
        const text = `${r.cliente} ${r.representante} ${r.produto} ${r.modelo} ${r.pedido} ${r.serial} ${r.descricao} ${r.obsAdmin || ''}`.toLowerCase();
        return text.includes(term);
      });

      if (status !== 'Todos') filtered = filtered.filter(r => r.status === status);
      if (filtroProduto.value !== 'Todos') filtered = filtered.filter(r => (r.produto || '').toLowerCase().includes(produto));

      return filtered;
    }

    function render() {
      const data = getFiltered();
      renderStats(records);

      if (!data.length) {
        lista.innerHTML = '<div class="empty">Nenhum chamado encontrado.</div>';
        return;
      }

      lista.innerHTML = data.map(item => {
        const imageHtml = item.imagem
          ? `<img src="${item.imagem}" alt="${escapeHtml(item.produto)}">`
          : 'Sem imagem';

        return `
          <article class="item">
            <div class="item-grid">
              <div class="thumb">${imageHtml}</div>
              <div class="content">
                <div class="topline">
                  <div>
                    <h3>${escapeHtml(item.produto || '-')}</h3>
                    <div style="color:#66758f; margin-top:4px;">Cliente: <b>${escapeHtml(item.cliente || '-')}</b></div>
                  </div>
                  <div class="badge ${statusClass(item.status)}">${escapeHtml(item.status || 'Novo')}</div>
                </div>

                <div class="meta">
                  <div class="meta-box"><b>Representante</b>${escapeHtml(item.representante || '-')}</div>
                  <div class="meta-box"><b>Telefone / E-mail</b>${escapeHtml(item.telefone || '-')}<br>${escapeHtml(item.email || '-')}</div>
                  <div class="meta-box"><b>Data de abertura</b>${escapeHtml(item.dataAbertura || '-')}</div>
                  <div class="meta-box"><b>Marca / modelo</b>${escapeHtml(item.modelo || '-')}</div>
                  <div class="meta-box"><b>Pedido / NF</b>${escapeHtml(item.pedido || '-')}</div>
                  <div class="meta-box"><b>Serial</b>${escapeHtml(item.serial || '-')}</div>
                </div>

                <div class="desc">${escapeHtml(item.descricao || '-')}</div>

                <div class="admin-grid">
                  <select id="status-${item.id}">
                    <option value="Novo" ${item.status === 'Novo' ? 'selected' : ''}>Novo</option>
                    <option value="Em análise" ${item.status === 'Em análise' ? 'selected' : ''}>Em análise</option>
                    <option value="Concluído" ${item.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
                  </select>
                  <textarea id="obs-${item.id}" class="admin-note" placeholder="Observação interna do administrativo">${escapeHtml(item.obsAdmin || '')}</textarea>
                </div>

                <div class="actions">
                  <button class="btn-primary" onclick="saveAdmin(${item.id})">Salvar análise</button>
                  <button class="btn-soft" onclick="copyItem(${item.id})">Copiar</button>
                  <button class="btn-soft" onclick="printItem(${item.id})">Imprimir</button>
                  <button class="btn-danger" onclick="removeItem(${item.id})">Excluir</button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function saveAdmin(id) {
      const item = records.find(r => r.id === id);
      if (!item) return;
      item.status = document.getElementById(`status-${id}`).value;
      item.obsAdmin = document.getElementById(`obs-${id}`).value.trim();
      try {
        await updateRecord(item);
        await loadData();
        render();
      } catch (error) {
        console.error(error);
        alert('Erro ao salvar análise.');
      }
    }

    function copyItem(id) {
      const item = records.find(r => r.id === id);
      if (!item) return;
      const text = `Cliente: ${item.cliente}\nRepresentante: ${item.representante || '-'}\nProduto: ${item.produto}\nModelo: ${item.modelo || '-'}\nPedido/NF: ${item.pedido || '-'}\nSerial: ${item.serial || '-'}\nDescrição: ${item.descricao}\nStatus: ${item.status || 'Novo'}\nObservação interna: ${item.obsAdmin || '-'}`;
      navigator.clipboard.writeText(text).catch(() => {});
    }

    function printItem(id) {
      const item = records.find(r => r.id === id);
      if (!item) return;
      const janela = window.open('', '_blank');
      janela.document.write(`
        <html>
          <head><title>B.O. ${item.produto}</title></head>
          <body style="font-family:Arial;padding:20px;line-height:1.6;">
            <h2>B.O. de Assistência</h2>
            <p><b>Cliente:</b> ${escapeHtml(item.cliente)}</p>
            <p><b>Representante:</b> ${escapeHtml(item.representante || '-')}</p>
            <p><b>Produto:</b> ${escapeHtml(item.produto || '-')}</p>
            <p><b>Modelo:</b> ${escapeHtml(item.modelo || '-')}</p>
            <p><b>Pedido/NF:</b> ${escapeHtml(item.pedido || '-')}</p>
            <p><b>Serial:</b> ${escapeHtml(item.serial || '-')}</p>
            <p><b>Status:</b> ${escapeHtml(item.status || 'Novo')}</p>
            <p><b>Descrição:</b><br>${escapeHtml(item.descricao || '-')}</p>
            <p><b>Observação interna:</b><br>${escapeHtml(item.obsAdmin || '-')}</p>
            <p><b>Data:</b> ${escapeHtml(item.dataAbertura || '-')}</p>
          </body>
        </html>
      `);
      janela.document.close();
      janela.print();
    }

    async function removeItem(id) {
      if (!confirm('Excluir este chamado?')) return;
      try {
        await deleteRecord(id);
        await loadData();
        render();
      } catch (error) {
        console.error(error);
        alert('Erro ao excluir chamado.');
      }
    }

    busca.addEventListener('input', render);
    filtroStatus.addEventListener('change', render);
    filtroProduto.addEventListener('change', render);
    btnAtualizar.addEventListener('click', async () => {
      await loadData();
      render();
    });

    window.saveAdmin = saveAdmin;
    window.copyItem = copyItem;
    window.printItem = printItem;
    window.removeItem = removeItem;

    (async function init() {
      try {
        await openDatabase();
        await loadData();
        render();
      } catch (error) {
        console.error(error);
        lista.innerHTML = '<div class="empty">Este ambiente de teste pode bloquear o armazenamento local.</div>';
      }
    })();
  </script>
</body>
</html>
